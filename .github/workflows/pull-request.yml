name: 'Pull Request Validation'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        uses: DEFRA/lis-github-actions/actions/version@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          branch: ${{ github.event.pull_request.head.ref }}
          release-type: prerelease

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Build, test and pack
        uses: DEFRA/lis-github-actions/actions/build-test-dotnet@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.event.pull_request.head.sha }}

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      quality-gate-status: ${{ steps.sonar.outputs.quality-gate-status }}
    steps:
      - name: Run Sonar analysis
        id: sonar
        uses: DEFRA/lis-github-actions/actions/sonar-dotnet@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.event.pull_request.head.sha }}
          sonar-token: ${{ secrets.TMP_SONAR_TOKEN || secrets.LIS_SONAR_TOKEN }}

  required-checks:
    name: 'Pull Request Validation'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          GET_VERSION_RESULT: ${{ needs.get-version.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test-pack.result }}
          SONAR_ANALYSIS_RESULT: ${{ needs.sonar-analysis.result }}
        run: |
          results=(
            "get-version=$GET_VERSION_RESULT"
            "build-test=$BUILD_TEST_RESULT"
            "sonar-analysis=$SONAR_ANALYSIS_RESULT"
          )

          printf '%s\n' "${results[@]}"

          for result in "${results[@]}"; do
            if [[ "$result" != *=success ]]; then
              echo "Required job did not succeed: $result" >&2
              exit 1
            fi
          done
