name: 'Publish Container Image'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: DEFRA/lis-github-actions/.github/workflows/container-publish.yml@0.5.0
    secrets: inherit
