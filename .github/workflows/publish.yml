name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Publish NuGet packages
        uses: DEFRA/lis-github-actions/actions/publish-nuget@90a6d6da2ab2d9caaf7ac11ef878017b51c09fd2 # v0.10.0
        with:
          version: ${{ github.ref_name }}
          nuget-username: ${{ secrets.NUGET_USERNAME }}
