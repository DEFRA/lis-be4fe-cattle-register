name: 'Publish Container Image'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Publish Container
        uses: DEFRA/lis-github-actions/actions/publish-container@feature/LREG-900-convert-to-actions # temporary branch test
        with:
          version: ${{ github.ref_name }}
          nuget-username: ${{ secrets.NUGET_USERNAME }}
