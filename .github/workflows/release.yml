name: 'Release'

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        uses: DEFRA/lis-github-actions/actions/version@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          branch: ${{ github.event.pull_request.head.ref }}
          release-type: stable

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Build, test and pack
        uses: DEFRA/lis-github-actions/actions/build-test-dotnet@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      quality-gate-status: ${{ steps.sonar.outputs.quality-gate-status }}
    steps:
      - name: Run Sonar analysis
        id: sonar
        uses: DEFRA/lis-github-actions/actions/sonar-dotnet@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          branch: main
          sonar-token: ${{ secrets.TMP_SONAR_TOKEN || secrets.LIS_SONAR_TOKEN }}

  create-tag:
    name: 'Tag Main'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: DEFRA/lis-github-actions/actions/tag@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ needs.get-version.outputs.version }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          app-client-id: ${{ vars.LIS_RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.LIS_RELEASE_APP_PRIVATE_KEY }}
