version: '3.4'
services:
  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data

  cattle-register:
    build: ./
    ports:
      - '3226:8085'
    links:
      - 'mongodb:mongodb'
    depends_on:
      mongodb:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8085
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Mongo__DatabaseName: lis-be4fe-cattle-register
      CattleApi__BaseUrl: http://host.docker.internal:5019
      CattleApi__ApiKey: local-dev-cattle-api-key
      # Inbound key; lis-apps-cattle-register is expected to send it as CATTLE_REGISTER_API_KEY.
      ApiKeyAuthentication__Keys__0: local-dev-cattle-register-api-key
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
